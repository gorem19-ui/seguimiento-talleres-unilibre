<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Seguimiento semanal de talleres – Bienestar Unilibre 2026-2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/lite.umd.js"></script>
<style>
:root{--bg:#f6f7f9;--ink:#1d2433;--mute:#667085;--line:#e4e7ec;--pri:#0b5c8f;--pri2:#e8f1f8;--ok:#1a7f4b;--okb:#e6f4ec;--warn:#a15c00;--warnb:#fdf1df;--bad:#b42318;--badb:#fdecea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:#fff;padding:14px 18px;border-bottom:4px solid var(--pri);text-align:center}
.logos{display:flex;justify-content:center;align-items:center;gap:28px;margin-bottom:8px}.logos img{height:72px;width:auto}
header h1{margin:0;font-size:18px;color:var(--pri)}header p{margin:3px 0 0;font-size:12px;color:var(--mute)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:16px}.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
input,select,textarea,button{font:inherit}
input[type=text],input[type=password],select,textarea{border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;background:#fff}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 14px;cursor:pointer}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button.big{width:100%;font-size:16px;font-weight:600}button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff}.tab.on{background:var(--pri2);color:var(--pri);border-color:var(--pri2);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:var(--warn)}.bad{background:var(--badb);color:var(--bad)}.mute{background:#f0f2f5;color:var(--mute)}
.msg{padding:10px 12px;border-radius:8px;font-size:14px;margin:10px 0}.msg.e{background:var(--badb);color:var(--bad)}.msg.s{background:var(--okb);color:var(--ok)}.msg.i{background:var(--pri2);color:#0a4568}
.nov{border:2px solid var(--warn);background:var(--warnb);border-radius:10px;padding:12px;margin-top:12px}
.nov b{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mute);font-weight:600;padding:7px;border-bottom:1px solid var(--line);background:#fafbfc}td{padding:7px;border-bottom:1px solid var(--line);vertical-align:top}
.big{font-size:22px;font-weight:700}.small{font-size:12px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi .v{font-size:22px;font-weight:700}
a{color:var(--pri)}textarea{min-height:200px}
img.prev{max-width:100%;max-height:260px;border-radius:8px;margin-top:8px}
.hidden{display:none}.cam{display:block;text-align:center;border:2px dashed var(--pri);color:var(--pri);background:var(--pri2);border-radius:10px;padding:14px;font-weight:600;cursor:pointer}
@media(max-width:600px){.logos img{height:56px}}
</style>
</head>
<body>
<header><div class="logos"><img src="logos/unilibre.png" alt="Universidad Libre"><img src="logos/recreavalle.png" alt="RECREAVALLE"></div><h1>Seguimiento semanal de talleres</h1><p>Bienestar Universitario 2026-2 · Universidad Libre Seccional Cali · RECREAVALLE</p></header>
<main id="app"></main>

<script>
const API='https://script.google.com/macros/s/AKfycbyOLbUG1TkHsapq_mV6mrgnui-09qtZO77r-yZy8NlJiKUJdMCurJTX49J80-H5-kmD/exec';
const VISTA=new URLSearchParams(location.search).get('vista')||(location.hash==='#panel'?'panel':'');
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const app=document.getElementById('app');
let S={};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function d(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fecha(s){const x=d(s);return DIAS[x.getDay()]+' '+x.getDate()+' de '+MES[x.getMonth()]}
function corta(s){const x=d(s);return DIAS[x.getDay()].slice(0,3)+' '+x.getDate()+'/'+(x.getMonth()+1)}
function h12(t){let [h,m]=t.split(':').map(Number);if(h===24)return '12:00 a. m.';return ((h%12)||12)+':'+String(m).padStart(2,'0')+(h>=12?' p. m.':' a. m.')}
function add(s,n){const x=d(s);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
async function call(fn,...a){let r;try{r=await fetch(API,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:a})})}catch(e){throw 'Sin conexión. Revise su internet e intente de nuevo.'}let j;try{j=await r.json()}catch(e){throw 'El servidor no respondió correctamente. Intente de nuevo.'}if(!j.ok)throw j.error;return j.data}
function msg(el,t,k){el.innerHTML=t?'<div class="msg '+(k||'i')+'">'+esc(t)+'</div>':''}

/* ======================= PROFESOR ======================= */
function vLogin(){
  app.innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><h2>Ingreso de profesores</h2><p class="sub">Escriba su número de cédula, sin puntos.</p><input type="text" id="cc" inputmode="numeric" autocomplete="off" placeholder="Número de cédula"><div id="m"></div><button class="pri big" id="go" style="margin-top:10px">Ingresar</button></div>';
  const go=async()=>{const b=document.getElementById('go');b.disabled=true;msg(document.getElementById('m'),'Verificando…');
    try{S=await call('login',document.getElementById('cc').value);S.tab='hoy';vProf()}catch(e){msg(document.getElementById('m'),e,'e');b.disabled=false}};
  document.getElementById('go').onclick=go;document.getElementById('cc').onkeydown=e=>{if(e.key==='Enter')go()};
}
function vProf(){
  app.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><div><div class="small">'+esc(S.prof.area)+'</div><div class="big">'+esc(S.prof.taller)+'</div><div>'+esc(S.prof.profesor)+'</div></div><button id="out">Salir</button></div></div>'+
   '<div class="tabs"><button class="tab" data-t="hoy">Registrar llegada / salida</button><button class="tab" data-t="sem">Mi horario</button></div><div id="v"></div>';
  document.getElementById('out').onclick=()=>{S={};vLogin()};
  app.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('on',b.dataset.t===S.tab);b.onclick=()=>{S.tab=b.dataset.t;vProf()}});
  S.tab==='hoy'?vHoy():vSem();
}

async function vHoy(){
  const v=document.getElementById('v');v.innerHTML='<div class="card">Cargando…</div>';
  let r;try{r=await call('hoy',S.token)}catch(e){v.innerHTML='<div class="card"><div class="msg e">'+esc(e)+'</div></div>';return}
  S.h=r;const tipo=r.siguiente;const T=tipo==='llegada'?'llegada':'salida';
  const pend=(r.pendientes||[]);
  const pendH=pend.length?'<div class="card" style="border:2px solid var(--bad)"><h2 style="color:var(--bad)">Tiene '+pend.length+' registro'+(pend.length>1?'s':'')+' pendiente'+(pend.length>1?'s':'')+'</h2><p class="sub">Son sesiones programadas que pasaron sin foto de '+'llegada o salida. Súbala para subsanarlas.</p>'+
    pend.map((p,i)=>'<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:10px 0"><div><b>'+fecha(p.fecha)+'</b><br><span class="small">Sesión '+h12(p.sesion.split('-')[0])+' – '+h12(p.sesion.split('-')[1])+' · falta '+esc(p.falta)+'</span></div><button data-p="'+i+'">Subsanar</button></div><div id="ps'+i+'"></div>').join('')+'</div>':'';
  v.innerHTML=pendH+'<div class="card"><h2>'+fecha(r.hoy)+'</h2>'+
   '<p class="sub">'+(r.sesiones.length?'Sesiones programadas hoy: '+r.sesiones.map(s=>h12(s.inicio)+' – '+h12(s.fin)+(s.etiqueta?' ('+esc(s.etiqueta)+')':'')).join(' · '):(r.festivo?'Hoy es festivo: no hay sesiones programadas.':'Hoy no tiene sesiones programadas.'))+'</p>'+
   (r.registros.length?'<div class="row" style="margin-bottom:10px">'+r.registros.map(x=>'<span class="pill '+(/A tiempo|Completa/.test(x.estado)&&!/Fuera|Sin ubic/.test(x.estado)?'ok':'warn')+'">'+(x.tipo==='llegada'?'Llegada':'Salida')+' '+esc(x.hora)+'</span>').join('')+'</div>':'')+
   '<div class="small" style="margin-bottom:6px">Foto de evidencia: tómela en el lugar del taller, sin estudiantes identificables.</div><label for="f" class="cam" id="camL">📷 Tomar foto</label><input type="file" accept="image/*" capture="environment" id="f" class="hidden"><img id="p" class="prev hidden">'+
   '<input type="text" id="o" placeholder="Observación (opcional)" style="margin-top:8px">'+
   '<button class="pri big" id="b" style="margin-top:12px">Registrar '+T+'</button><div id="nv"></div><div id="m"></div></div>';
  const f=document.getElementById('f');f.onchange=()=>{const p=document.getElementById('p');if(f.files[0]){p.src=URL.createObjectURL(f.files[0]);p.classList.remove('hidden');document.getElementById('camL').textContent='📷 Cambiar foto'}};
  document.getElementById('b').onclick=()=>paso1(tipo);
  v.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>formSub(pend[b.dataset.p],b.dataset.p));
}
function formSub(p,i){
  document.querySelectorAll('[id^=ps]').forEach(x=>x.innerHTML='');
  const box=document.getElementById('ps'+i);
  box.innerHTML='<div class="nov"><b>Subsanar '+fecha(p.fecha).toLowerCase()+' ('+esc(p.sesion)+')</b><p class="small" style="margin:6px 0 10px">Adjunte una foto de la sesión (puede tomarla ahora o elegirla de su galería) y explique por qué no la registró a tiempo.</p>'+
    '<label for="sf" class="cam" id="sfL">📷 Tomar o elegir foto</label><input type="file" accept="image/*" id="sf" class="hidden"><img id="sp" class="prev hidden">'+
    '<label class="small" style="display:block;margin-top:10px">Motivo</label><select id="snov"><option value="">Seleccione…</option>'+S.novedades.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>'+
    '<textarea id="sdet" placeholder="¿Por qué no registró a tiempo? (obligatorio)" style="min-height:70px;margin-top:8px"></textarea>'+
    '<div class="row" style="margin-top:10px"><button class="pri" id="sok">Enviar</button><button id="scan">Cancelar</button></div><div id="sm"></div></div>';
  const f=document.getElementById('sf');f.onchange=()=>{const im=document.getElementById('sp');if(f.files[0]){im.src=URL.createObjectURL(f.files[0]);im.classList.remove('hidden');document.getElementById('sfL').textContent='📷 Cambiar foto'}};
  document.getElementById('scan').onclick=()=>{box.innerHTML=''};
  document.getElementById('sok').onclick=async()=>{const m=document.getElementById('sm');const n=document.getElementById('snov').value,dt=document.getElementById('sdet').value.trim();
    if(!f.files[0]){msg(m,'Adjunte la foto.','e');return}if(!n){msg(m,'Seleccione el motivo.','e');return}if(dt.length<5){msg(m,'Explique por qué no registró a tiempo.','e');return}
    const b=document.getElementById('sok');b.disabled=true;msg(m,'Enviando…');
    let u=await ubicar();let fotoHora='';
    try{if(window.exifr){const ex=await exifr.parse(f.files[0],{gps:true,pick:['DateTimeOriginal','latitude','longitude']});if(ex){if(ex.DateTimeOriginal){const t=new Date(ex.DateTimeOriginal);fotoHora=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}if(!u&&ex.latitude!=null)u={lat:ex.latitude,lng:ex.longitude,precision:'',origen:'GPS de la foto'}}}}catch(e){}
    try{const foto=await reducir(f.files[0]);await call('subsanar',S.token,{clave:p.clave,foto:foto,novedad:n,detalle:dt,lat:u?u.lat:null,lng:u?u.lng:null,precision:u?u.precision:'',origen:u?u.origen:'',fotoHora:fotoHora});
      msg(m,'Pendiente subsanado. Queda marcado como registro extemporáneo.','s');setTimeout(vHoy,2500)}catch(e){msg(m,e,'e');b.disabled=false}};
}
function ubicar(){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,precision:Math.round(p.coords.accuracy),origen:'GPS del celular'}),()=>ok(null),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
function reducir(file){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.8).split(',')[1])};img.onerror=()=>ko('No se pudo leer la foto.');img.src=URL.createObjectURL(file)})}
async function paso1(tipo){
  const m=document.getElementById('m'),f=document.getElementById('f'),b=document.getElementById('b');
  if(!f.files[0]){msg(m,'Primero tome la foto.','e');return}
  b.disabled=true;msg(m,'Obteniendo ubicación…');
  const file=f.files[0];let u=await ubicar();let fotoHora='';
  try{if(window.exifr){const ex=await exifr.parse(file,{gps:true,pick:['DateTimeOriginal','latitude','longitude']});
    if(ex){if(ex.DateTimeOriginal){const t=new Date(ex.DateTimeOriginal);fotoHora=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}
      if(!u&&ex.latitude!=null)u={lat:ex.latitude,lng:ex.longitude,precision:'',origen:'GPS de la foto'}}}}catch(e){}
  S.reg={tipo:tipo,lat:u?u.lat:null,lng:u?u.lng:null,precision:u?u.precision:'',origen:u?u.origen:'',fotoHora:fotoHora};
  msg(m,'Verificando horario y ubicación…');
  let ev;try{ev=await call('evaluar',S.token,{tipo:tipo,lat:S.reg.lat,lng:S.reg.lng})}catch(e){msg(m,e,'e');b.disabled=false;return}
  if(!ev.requiereNovedad){msg(m,'');enviar();return}
  msg(m,'');
  document.getElementById('nv').innerHTML='<div class="nov"><b>Este registro queda por fuera de lo programado:</b><ul style="margin:6px 0 10px;padding-left:18px">'+
    (ev.fueraHorario?'<li>Horario: '+esc(ev.fueraHorario)+'</li>':'')+(ev.fueraRango?'<li>Ubicación: '+esc(ev.fueraRango)+'</li>':'')+'</ul>'+
    '<label class="small">Motivo de la novedad</label><select id="nov"><option value="">Seleccione…</option>'+S.novedades.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>'+
    '<textarea id="det" placeholder="Explique la novedad (obligatorio si elige «Otra»)" style="min-height:70px;margin-top:8px"></textarea>'+
    '<div class="row" style="margin-top:10px"><button class="pri" id="ok">Confirmar registro</button><button id="can">Cancelar</button></div></div>';
  document.getElementById('can').onclick=()=>vHoy();
  document.getElementById('ok').onclick=()=>{const n=document.getElementById('nov').value,dt=document.getElementById('det').value.trim();
    if(!n){msg(m,'Seleccione el motivo de la novedad.','e');return}if(n==='Otra'&&dt.length<5){msg(m,'Explique el motivo de la novedad.','e');return}
    S.reg.novedad=n;S.reg.detalle=dt;enviar()};
}
async function enviar(){
  const m=document.getElementById('m');msg(m,'Enviando registro…');
  document.querySelectorAll('#v button').forEach(x=>x.disabled=true);
  try{const foto=await reducir(document.getElementById('f').files[0]);
    const r=await call('registrar',S.token,Object.assign({},S.reg,{foto:foto,obs:document.getElementById('o').value}));
    msg(m,(S.reg.tipo==='llegada'?'Llegada':'Salida')+' registrada a las '+r.hora+'. '+r.estado,'s');setTimeout(vHoy,3000);
  }catch(e){msg(m,e,'e');document.querySelectorAll('#v button').forEach(x=>x.disabled=false)}
}
async function vSem(){
  const v=document.getElementById('v');v.innerHTML='<div class="card">Cargando…</div>';
  let r;try{r=await call('miSemana',S.token)}catch(e){v.innerHTML='<div class="card"><div class="msg e">'+esc(e)+'</div></div>';return}
  v.innerHTML='<div class="card"><h2>Semana del '+fecha(r.semana).toLowerCase()+' al '+fecha(add(r.semana,6)).toLowerCase()+'</h2>'+
   (r.sesiones.length?'<table><tr><th>Día</th><th>Horario</th></tr>'+r.sesiones.map(x=>'<tr><td>'+fecha(x.fecha)+'</td><td>'+h12(x.inicio)+' – '+h12(x.fin)+(x.etiqueta?' · '+esc(x.etiqueta):'')+(x.festivo?' <span class="pill warn">Festivo</span>':'')+'</td></tr>').join('')+'</table>':'<p class="sub">No tiene sesiones programadas esta semana.</p>')+
   '<p class="small">Si debe dictar en otro horario o lugar, registre igual su llegada y salida: la aplicación le pedirá el motivo de la novedad.</p></div>';
}

/* ======================= PANEL COORDINACIÓN ======================= */
function vClave(){
  app.innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><h2>Panel de coordinación</h2><input type="password" id="k" placeholder="Clave"><div id="m"></div><button class="pri big" id="go" style="margin-top:10px">Entrar</button></div>';
  const go=async()=>{S.clave=document.getElementById('k').value;try{S.p=await call('panel',S.clave,'');S.tab='res';vPanel()}catch(e){msg(document.getElementById('m'),e,'e')}};
  document.getElementById('go').onclick=go;document.getElementById('k').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function recargar(sem){try{S.p=await call('panel',S.clave,sem);vPanel()}catch(e){const m=document.getElementById('pm');if(m)msg(m,e,'e')}}
function vPanel(){
  const p=S.p;const area=S.area||'';const T=p.talleres.filter(t=>!area||t.area===area);
  let prog=0,ll=0,sin=0,fh=0,fr=0;const P=(p.pendientes||[]).filter(x=>!area||T.some(t=>t.id===x.id));const abiertos=P.filter(x=>x.estado==='Pendiente').length;
  T.forEach(t=>{t.sesiones.forEach(s=>{prog++;if(s.llegada)ll++;else if(s.vencida)sin++});t.registros.forEach(r=>{if(r.fueraHorario)fh++;if(r.fueraRango)fr++})});
  const areas=[...new Set(p.talleres.map(t=>t.area))];
  app.innerHTML='<div class="card row" style="justify-content:space-between"><div class="row"><label class="small">Semana <select id="sem">'+p.semanas.map(w=>'<option value="'+w+'"'+(w===p.semana?' selected':'')+'>'+corta(w)+' – '+corta(add(w,6))+'</option>').join('')+'</select></label>'+
   '<label class="small">Área <select id="ar"><option value="">Todas</option>'+areas.map(a=>'<option'+(area===a?' selected':'')+'>'+esc(a)+'</option>').join('')+'</select></label></div><button id="rf">Actualizar</button></div><div id="pm"></div>'+
   '<div class="tabs"><button class="tab" data-t="res">Resumen</button><button class="tab" data-t="m1">Mensaje semanal</button><button class="tab" data-t="ses">Sesiones</button><button class="tab" data-t="nov">Novedades</button><button class="tab" data-t="pen">Pendientes'+(abiertos?' ('+abiertos+')':'')+'</button></div><div id="pv"></div>';
  document.getElementById('sem').onchange=e=>recargar(e.target.value);
  document.getElementById('ar').onchange=e=>{S.area=e.target.value;vPanel()};
  document.getElementById('rf').onclick=()=>recargar(p.semana);
  app.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('on',b.dataset.t===S.tab);b.onclick=()=>{S.tab=b.dataset.t;vPanel()}});
  const pv=document.getElementById('pv');
  const novs=[];T.forEach(t=>t.registros.forEach(r=>{if(r.fueraHorario||r.fueraRango)novs.push([t,r])}));
  if(S.tab==='res'){
    pv.innerHTML='<div class="kpis">'+k('Sesiones programadas',prog)+k('Con llegada registrada',ll)+k('Vencidas sin registro',sin)+k('Registros fuera de horario',fh)+k('Registros fuera de rango',fr)+k('Pendientes sin subsanar',abiertos)+'</div>'+
     '<div class="card"><h2>Alertas</h2><table><tr><th>Taller</th><th>Profesor</th><th>Alerta</th></tr>'+
     T.map(t=>t.sesiones.filter(s=>s.vencida&&!s.llegada).map(s=>'<tr><td>'+esc(t.taller)+'</td><td>'+esc(t.profesor)+'</td><td><span class="pill bad">Sin registro: '+corta(s.fecha)+' '+esc(s.sesion)+'</span></td></tr>').join('')).join('')+
     novs.map(([t,r])=>'<tr><td>'+esc(t.taller)+'</td><td>'+esc(t.profesor)+'</td><td><span class="pill warn">'+corta(r.fecha)+' '+esc(r.hora)+' · '+esc(r.estado)+'</span><br><span class="small">Motivo: '+esc(r.novedad)+(r.detalle?' — '+esc(r.detalle):'')+'</span></td></tr>').join('')+'</table></div>';
  }
  if(S.tab==='pen'){
    const ord=P.slice().sort((a,b)=>(a.estado==='Pendiente'?0:1)-(b.estado==='Pendiente'?0:1)||b.fecha.localeCompare(a.fecha));
    pv.innerHTML='<div class="card"><h2>Registros pendientes</h2><p class="sub">Sesiones programadas que pasaron sin foto de llegada o de salida. El profesor las ve al entrar y las puede subsanar con foto y motivo.</p><div style="overflow-x:auto"><table><tr><th>Sesión</th><th>Taller</th><th>Falta</th><th>Estado</th><th>Motivo</th><th>Foto</th></tr>'+
     (ord.length?ord.map(x=>'<tr><td>'+corta(x.fecha)+' '+esc(x.sesion)+'</td><td>'+esc(x.taller)+'<br><span class="small">'+esc(x.profesor)+'</span></td><td>'+esc(x.falta)+'</td><td><span class="pill '+(x.estado==='Pendiente'?'bad':'ok')+'">'+esc(x.estado)+'</span>'+(x.subsanado?'<br><span class="small">'+esc(x.subsanado)+'</span>':'<br><span class="small">Detectado '+esc(x.detectado)+'</span>')+'</td><td class="small">'+esc(x.novedad)+(x.detalle?' — '+esc(x.detalle):'')+'</td><td>'+(x.foto?'<a href="'+esc(x.foto)+'" target="_blank">ver</a>':'')+'</td></tr>').join(''):'<tr><td colspan="6" class="small">Sin pendientes.</td></tr>')+'</table></div></div>';
  }
  if(S.tab==='m1'){
    const txt=S.txt&&S.txtSem===p.semana?S.txt:mensaje(p);
    pv.innerHTML='<div class="card"><h2>Mensaje semanal para el grupo de WhatsApp</h2><textarea id="tx">'+esc(txt)+'</textarea><div class="row" style="margin-top:10px"><button class="pri" id="cp">Copiar</button><a id="wa" target="_blank" href="https://wa.me/?text='+encodeURIComponent(txt)+'"><button type="button">Abrir en WhatsApp</button></a><button id="rs">Restaurar texto</button></div><div id="cpm"></div></div>';
    const tx=document.getElementById('tx');tx.oninput=()=>{S.txt=tx.value;S.txtSem=p.semana;document.getElementById('wa').href='https://wa.me/?text='+encodeURIComponent(tx.value)};
    document.getElementById('cp').onclick=async()=>{try{await navigator.clipboard.writeText(tx.value)}catch(e){tx.select();document.execCommand('copy')}msg(document.getElementById('cpm'),'Copiado.','s')};
    document.getElementById('rs').onclick=()=>{S.txt='';vPanel()};
  }
  if(S.tab==='ses'){
    pv.innerHTML='<div class="card"><h2>Sesiones programadas y registros</h2><div style="overflow-x:auto"><table><tr><th>Taller</th><th>Sesión</th><th>Llegada</th><th>Salida</th></tr>'+
     T.map(t=>t.sesiones.map((s,j)=>'<tr><td>'+(j?'':'<b>'+esc(t.taller)+'</b><br><span class="small">'+esc(t.profesor)+'</span>')+'</td><td>'+corta(s.fecha)+' '+esc(s.sesion)+'</td><td>'+reg(s.llegada,s.vencida)+'</td><td>'+reg(s.salida,s.vencida)+'</td></tr>').join('')).join('')+'</table></div></div>';
  }
  if(S.tab==='nov'){
    pv.innerHTML='<div class="card"><h2>Registros con novedad</h2><p class="sub">Todo registro fuera de horario o fuera del rango de la sede, con el motivo que dio el profesor.</p><div style="overflow-x:auto"><table><tr><th>Fecha y hora</th><th>Taller</th><th>Tipo</th><th>Fuera de horario</th><th>Fuera de rango</th><th>Motivo</th><th>Foto</th></tr>'+
     (novs.length?novs.map(([t,r])=>'<tr><td>'+corta(r.fecha)+' '+esc(r.hora)+'</td><td>'+esc(t.taller)+'<br><span class="small">'+esc(t.profesor)+'</span></td><td>'+esc(r.tipo)+'</td><td>'+(r.fueraHorario?'<span class="pill warn">Sí</span>':'No')+'</td><td>'+(r.fueraRango?'<span class="pill warn">Sí'+(r.dist?' · '+esc(r.dist)+' m':'')+'</span>':'No')+'</td><td>'+esc(r.novedad)+(r.detalle?'<br><span class="small">'+esc(r.detalle)+'</span>':'')+'<br><span class="small">'+esc(r.estado)+'</span></td><td>'+(r.foto?'<a href="'+esc(r.foto)+'" target="_blank">ver</a>':'')+'</td></tr>').join(''):'<tr><td colspan="7" class="small">Sin novedades esta semana.</td></tr>')+'</table></div></div>';
  }
}
function k(l,v){return '<div class="kpi"><div class="small">'+esc(l)+'</div><div class="v">'+esc(v)+'</div></div>'}
function reg(r,ven){if(!r)return ven?'<span class="pill bad">Sin registro</span>':'<span class="small">—</span>';
  const w=r.fueraHorario||r.fueraRango;return esc(r.hora)+' <span class="pill '+(w?'warn':'ok')+'">'+esc(r.estado)+'</span>'+(r.novedad?'<br><span class="small">Motivo: '+esc(r.novedad)+(r.detalle?' — '+esc(r.detalle):'')+'</span>':'')+(r.foto?' · <a href="'+esc(r.foto)+'" target="_blank">foto</a>':'')}
function mensaje(p){
  const ini=p.semana,fin=add(ini,6);const fe=Object.keys(p.festivos).filter(x=>x>=ini&&x<=fin);
  let m='👋 Buenos días, profes.\n\nIniciamos la semana del '+fecha(ini).toLowerCase()+' al '+fecha(fin).toLowerCase()+'. Les recordamos cumplir los horarios que cada uno propuso para su taller.\n\n'+
   '📸 En cada sesión registren su llegada y su salida con foto en este enlace, entrando con su cédula:\n'+p.url+'\n\n'+
   '⚠️ Si dictan en otro horario o lugar, registren igual: la aplicación les pedirá el motivo de la novedad.\n\n'+
   '📧 Si una novedad les impide dictar la sesión, repórtenla a: '+p.correos+'.';
  if(fe.length)m+='\n\n📅 Tengan en cuenta: '+fe.map(x=>fecha(x).toLowerCase()+', festivo ('+p.festivos[x]+')').join('; ')+'.';
  return m+'\n\n¡Que tengan una excelente semana!';
}
VISTA==='panel'?vClave():vLogin();
</script>
